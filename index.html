
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARK RACING 4.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d16;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:14px;background:#111b2b;border-bottom:2px solid #00d9ff}
h1{margin:0;color:#00d9ff;letter-spacing:3px}
#hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;padding:12px;font-weight:bold}
canvas{display:block;width:min(100%,480px);height:auto;margin:auto;background:#252a31;border:2px solid #00d9ff}
button{border:0;border-radius:10px;padding:13px 16px;margin:4px;background:#172b43;color:#fff;font-weight:bold;font-size:15px;touch-action:none}
button:active{background:#00a8ce}
#nitro{background:#e65a17}
#start{background:#00c8e8;color:#00121a}
#message{min-height:27px;color:#00d9ff;font-weight:bold;padding:5px}
</style>
</head>
<body>
<header><h1>STARK RACING</h1><div>4.3 • TOP-DOWN EDITION</div></header>
<div id="hud">
<span id="lv">LEVEL 1</span>
<span id="sp">0 KM/H</span>
<span id="dist">0 / 100.000 m</span>
<span id="sc">SCORE 0</span>
</div>
<canvas id="game" width="480" height="700"></canvas>
<div id="message">Bereit für das Rennen?</div>
<div>
<button id="left">⬅ LINKS</button>
<button id="right">RECHTS ➡</button><br>
<button id="brake">🛑 BREMSEN</button>
<button id="nitro">⚡ NITRO</button><br>
<button id="start">🏁 RENNEN STARTEN</button>
<button id="sound">🔊 SOUND AN</button>
</div>
<script>
"use strict";
const c=document.getElementById("game"),g=c.getContext("2d");
const $=id=>document.getElementById(id);
const keys={left:false,right:false,brake:false,nitro:false};
let level=1,speed=0,distance=0,score=0,running=false,finished=false;
let nitroTime=0,roadOffset=0,last=0,spawn=0,traffic=[],bossHP=100;
let audio=null,motor=null,motorGain=null,turbo=null,turboGain=null,soundOn=true;
const boss=()=>level%3===0;
const length=()=>boss()?150000:100000;
const road={left:65,right:415};
const player={x:218,y:535,w:44,h:78};

function soundStart(){
 if(!soundOn)return;
 if(!audio){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audio=new AC();
  motor=audio.createOscillator();motorGain=audio.createGain();
  const filter=audio.createBiquadFilter();
  motor.type="sawtooth";filter.type="lowpass";filter.frequency.value=500;
  motorGain.gain.value=0;motor.connect(filter);filter.connect(motorGain);
  motorGain.connect(audio.destination);motor.start();
  turbo=audio.createOscillator();turboGain=audio.createGain();
  turbo.type="square";turboGain.gain.value=0;
  turbo.connect(turboGain);turboGain.connect(audio.destination);turbo.start();
 }
 if(audio.state==="suspended")audio.resume();
}
function soundUpdate(){
 if(!audio)return;
 const t=audio.currentTime;
 motor.frequency.setTargetAtTime(55+speed*3,t,.08);
 motorGain.gain.setTargetAtTime(running&&soundOn?.045:0,t,.08);
 turbo.frequency.setTargetAtTime(100+speed*5,t,.06);
 turboGain.gain.setTargetAtTime(running&&soundOn&&nitroTime>0?.018:0,t,.06);
}
function start(){
 if(running)return;
 speed=0;distance=0;nitroTime=0;traffic=[];spawn=0;bossHP=100;
 player.x=218;finished=false;running=true;last=performance.now();
 $("message").textContent=boss()?"👑 BOSSRENNEN!":"🏁 LOS GEHT'S!";
 soundStart();requestAnimationFrame(loop);
}
function hud(){
 $("lv").textContent="LEVEL "+level+(boss()?" 👑":"");
 $("sp").textContent=Math.round(speed*7)+" KM/H";
 $("dist").textContent=Math.floor(distance).toLocaleString("de-DE")+" / "+length().toLocaleString("de-DE")+" m";
 $("sc").textContent="SCORE "+score.toLocaleString("de-DE");
}
function finish(){
 running=false;finished=true;speed=0;score+=1000;
 $("message").textContent=boss()?"🏆 BOSS BESIEGT! LEVEL GESCHAFFT!":"🏆 RENNEN GESCHAFFT!";
 $("start").textContent="➡ NÄCHSTES LEVEL";
 draw();hud();soundUpdate();
}
function rounded(x,y,w,h,r,col){
 g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();
}
function drawRoad(){
 g.fillStyle="#22613c";g.fillRect(0,0,480,700);
 g.fillStyle="#30343b";g.fillRect(road.left,0,road.right-road.left,700);
 g.fillStyle="#f5f5f5";g.fillRect(road.left,0,4,700);g.fillRect(road.right-4,0,4,700);
 for(let y=-80;y<780;y+=90){
  const yy=(y+roadOffset)%780;
  g.fillStyle="#eee";
  g.fillRect(road.left+115,yy,5,43);
  g.fillRect(road.left+230,yy,5,43);
 }
 // Streckenrand-Markierungen
 for(let y=-40;y<740;y+=40){
  const yy=(y+roadOffset*1.5)%740;
  g.fillStyle="#f4f4f4";g.fillRect(road.left-9,yy,8,20);
  g.fillStyle="#ff4545";g.fillRect(road.right+1,yy,8,20);
 }
}
function drawCar(x,y,w,h,col,hero=false){
 rounded(x,y,w,h,8,col);
 rounded(x+w*.17,y+h*.18,w*.66,h*.25,5,hero?"#80dfff":"#18283a");
 g.fillStyle="#fff1a0";
 g.fillRect(x+4,y+5,8,5);g.fillRect(x+w-12,y+5,8,5);
 g.fillStyle="#ff3333";
 g.fillRect(x+4,y+h-8,8,5);g.fillRect(x+w-12,y+h-8,8,5);
 g.fillStyle="#111";
 g.fillRect(x-3,y+14,5,17);g.fillRect(x+w-2,y+14,5,17);
 if(hero){g.strokeStyle="#00eaff";g.lineWidth=2;g.strokeRect(x-2,y-2,w+4,h+4);}
}
function draw(){
 g.clearRect(0,0,480,700);drawRoad();
 traffic.forEach(t=>drawCar(t.x,t.y,t.w,t.h,t.color));
 if(nitroTime>0){
  g.fillStyle="#00d9ff";
  g.beginPath();g.moveTo(player.x+7,player.y+player.h);
  g.lineTo(player.x+13,player.y+player.h+30+Math.random()*12);
  g.lineTo(player.x+20,player.y+player.h);g.fill();
  g.beginPath();g.moveTo(player.x+25,player.y+player.h);
  g.lineTo(player.x+32,player.y+player.h+30+Math.random()*12);
  g.lineTo(player.x+38,player.y+player.h);g.fill();
 }
 drawCar(player.x,player.y,player.w,player.h,nitroTime>0?"#00d9ff":"#e8edf4",true);
 if(boss()&&running){
  g.fillStyle="#111";g.fillRect(115,12,250,14);
  g.fillStyle="#ff3434";g.fillRect(117,14,246*bossHP/100,10);
  g.fillStyle="#fff";g.font="12px Arial";g.textAlign="center";
  g.fillText("BOSS ENERGY",240,10);
 }
 if(!running){
  g.fillStyle="rgba(0,0,0,.72)";g.fillRect(20,270,440,130);
  g.fillStyle="#00d9ff";g.textAlign="center";g.font="bold 27px Arial";
  g.fillText(finished?"RACE COMPLETE":"STARK RACING",240,320);
  g.fillStyle="#fff";g.font="17px Arial";
  g.fillText(finished?"Bereit für die nächste Runde?":"Starte dein Rennen!",240,355);
 }
}
function update(dt){
 if(!running)return;
 if(keys.nitro&&nitroTime<=0&&speed>8)nitroTime=2;
 nitroTime=Math.max(0,nitroTime-dt);
 if(keys.brake)speed=Math.max(0,speed-25*dt);
 else speed=Math.min(nitroTime>0?45:30,speed+(nitroTime>0?30:14)*dt);
 if(keys.left)player.x-=230*dt;
 if(keys.right)player.x+=230*dt;
 player.x=Math.max(road.left+5,Math.min(road.right-player.w-5,player.x));
 distance+=speed*dt*55;
 roadOffset=(roadOffset+speed*dt*5)%780;
 spawn-=dt;
 if(spawn<=0){
  const lanes=[road.left+35,road.left+100,road.left+175,road.left+245,road.right-65];
  const x=lanes[Math.floor(Math.random()*lanes.length)];
  traffic.push({x,y:-100,w:42,h:72,color:["#ff3434","#ffce38","#a274ff","#f5f5f5"][Math.floor(Math.random()*4)],boss:boss()});
  spawn=boss()?1.0:Math.max(.55,1.5-speed/65);
 }
 traffic.forEach(t=>{
  t.y+=(speed*1.2+70)*dt;
  if(!t.hit&&player.x<t.x+t.w&&player.x+player.w>t.x&&player.y<t.y+t.h&&player.y+player.h>t.y){
   t.hit=true;speed=Math.max(0,speed-12);score=Math.max(0,score-50);
   if(boss())bossHP=Math.max(0,bossHP-8);
   $("message").textContent="💥 KOLLISION! Vorsicht!";
  }
 });
 traffic=traffic.filter(t=>t.y<760);
 score+=Math.floor(speed*dt);
 if(distance>=length()){finish();return;}
 hud();soundUpdate();
}
function loop(now){
 if(!running)return;
 const dt=Math.min((now-last)/1000,.04);last=now;
 update(dt);draw();
 if(running)requestAnimationFrame(loop);
}
function hold(id,key){
 const el=$(id),down=e=>{e.preventDefault();keys[key]=true;},up=e=>{e.preventDefault();keys[key]=false;};
 el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);
 el.addEventListener("pointerleave",up);el.addEventListener("pointercancel",up);
}
hold("left","left");hold("right","right");hold("brake","brake");hold("nitro","nitro");
window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=true;
 if(e.code==="Space"||e.key==="Shift")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=false;
 if(e.code==="Space"||e.key==="Shift")keys.nitro=false;
});
$("start").onclick=()=>{
 if(finished){level++;$("start").textContent="🏁 RENNEN STARTEN";}
 start();
};
$("sound").onclick=()=>{
 soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 SOUND AN":"🔇 SOUND AUS";
 if(soundOn)soundStart();soundUpdate();
};
draw();hud();
</script>
</body>
</html>
