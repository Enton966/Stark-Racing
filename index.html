
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK RACING 2.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#070914;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
header{padding:18px 8px 8px}
h1{
  margin:0;color:#00f5ff;font-size:clamp(28px,7vw,44px);
  text-shadow:0 0 15px #00d9ff;
}
.subtitle{color:#ff3cfa;margin:8px}
.panel{
  max-width:500px;margin:12px auto;padding:14px;
  border:1px solid #00eaff;border-radius:15px;
  background:#101529;box-shadow:0 0 15px #003b55;
}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.stat{color:#00f5ff;font-weight:bold}
button,select{
  color:white;background:#18213a;border:1px solid #00eaff;
  border-radius:10px;padding:11px 14px;font-size:15px;
  cursor:pointer;margin:4px;
}
button:active{transform:scale(.96)}
.primary{background:#00d9ff;color:#06101a;font-weight:bold}
#game{
  display:block;width:min(94vw,400px);height:auto;
  margin:12px auto;border:2px solid #00eaff;
  border-radius:12px;background:#10151d;
  box-shadow:0 0 20px #006a8b;
  touch-action:manipulation;
}
.controls{
  max-width:400px;margin:10px auto;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
}
.controls button{font-size:22px;padding:15px 5px}
#message{min-height:24px;color:#ffdb5c;font-weight:bold}
.small{font-size:13px;color:#aab7d8}
</style>
</head>
<body>
<header>
  <h1>STARK RACING</h1>
  <div class="subtitle">RACE • NITRO • DOMINATE</div>
</header>

<div class="panel">
  <div class="stats">
    <div>SCORE<br><span class="stat" id="score">0</span></div>
    <div>LEVEL<br><span class="stat" id="level">1</span></div>
    <div>BEST<br><span class="stat" id="best">0</span></div>
  </div>
  <p>Wähle dein Fahrzeug:</p>
  <select id="car">
    <option value="#00eaff">⚡ Neon Blue</option>
    <option value="#ff304f">🔥 Red Rocket</option>
    <option value="#ffe34d">🌟 Gold Racer</option>
    <option value="#a45bff">💜 Purple Storm</option>
    <option value="#46ff85">☢️ Green Machine</option>
  </select>
  <br>
  <button class="primary" id="start">▶ START RACE</button>
  <button id="nitro">⚡ NITRO</button>
  <p id="message">Bereit für das Rennen?</p>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="brake">🛑</button>
  <button id="right">➡️</button>
</div>
<p class="small">Steuerung: Pfeiltasten / A und D • Leertaste = Nitro</p>
<p class="small">Weiche den anderen Autos aus und knacke deinen Highscore!</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const lanes=[85,200,315];
let player={lane:1,x:200,y:480};
let traffic=[],particles=[];
let running=false,score=0,level=1;
let speed=4,nitroTime=0,spawnTimer=0;
let best=Number(localStorage.getItem("starkBest")||0);
let lastTime=0,animation=0,roadOffset=0;
let crashSoundEnabled=true;
let audio;

$("best").textContent=best;

function sound(freq,duration,type="sine",volume=.045){
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}

function roundedRect(x,y,w,h,r,color){
  ctx.fillStyle=color;ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function drawCar(x,y,color,isPlayer=false){
  // Schatten
  ctx.fillStyle="#0008";
  ctx.beginPath();ctx.ellipse(x,y+15,25,39,0,0,Math.PI*2);ctx.fill();

  // Räder
  roundedRect(x-23,y-25,9,20,3,"#050609");
  roundedRect(x+14,y-25,9,20,3,"#050609");
  roundedRect(x-23,y+14,9,20,3,"#050609");
  roundedRect(x+14,y+14,9,20,3,"#050609");

  // Karosserie
  ctx.save();
  ctx.shadowColor=color;ctx.shadowBlur=isPlayer?18:7;
  roundedRect(x-17,y-35,34,70,9,color);
  ctx.restore();

  // Fenster
  roundedRect(x-12,y-19,24,19,5,"#17283d");
  roundedRect(x-12,y+8,24,12,4,"#17283d");

  // Lichter
  roundedRect(x-14,y-32,9,5,2,"#fff8a0");
  roundedRect(x+5,y-32,9,5,2,"#fff8a0");
  roundedRect(x-14,y+27,9,4,2,"#ff304f");
  roundedRect(x+5,y+27,9,4,2,"#ff304f");

  if(isPlayer && nitroTime>0){
    for(let i=0;i<5;i++){
      ctx.fillStyle=i%2?"#ff3cfa":"#00f5ff";
      ctx.beginPath();
      ctx.moveTo(x-10+i*5,y+35);
      ctx.lineTo(x-8+i*5,y+45+Math.random()*18);
      ctx.lineTo(x-4+i*5,y+35);
      ctx.fill();
    }
  }
}

function drawRoad(){
  ctx.fillStyle="#101a1b";ctx.fillRect(0,0,400,600);
  ctx.fillStyle="#252a35";ctx.fillRect(35,0,330,600);

  ctx.fillStyle="#00d9ff";
  ctx.fillRect(35,0,3,600);ctx.fillRect(362,0,3,600);

  ctx.fillStyle="#a3a8b8";
  for(let x of [145,255]){
    for(let y=-70+(roadOffset%90);y<620;y+=90){
      ctx.fillRect(x-2,y,4,48);
    }
  }

  ctx.fillStyle="#ffffff18";
  ctx.fillRect(45,0,4,600);ctx.fillRect(351,0,4,600);
}

function drawBackground(){
  drawRoad();
  for(const t of traffic)drawCar(t.x,t.y,t.color,false);
  drawCar(lanes[player.lane],player.y,$("car").value,true);

  if(!running){
    ctx.fillStyle="#0009";ctx.fillRect(45,205,310,125);
    ctx.textAlign="center";
    ctx.fillStyle="#00f5ff";ctx.font="bold 28px Arial";
    ctx.fillText("STARK RACING",200,250);
    ctx.fillStyle="white";ctx.font="16px Arial";
    ctx.fillText("Drücke START RACE!",200,285);
  }
}

function updateStats(){
  $("score").textContent=Math.floor(score);
  $("level").textContent=level;
  $("best").textContent=best;
}

function spawnTraffic(){
  const lane=Math.floor(Math.random()*3);
  // Nicht direkt in derselben Spur direkt vor dem Spieler spawnen
  if(traffic.some(t=>t.lane===lane&&t.y<115))return;
  const colors=["#ff3c59","#ffbd39","#a45bff","#eeeeee","#46ff85"];
  traffic.push({
    lane,x:lanes[lane],y:-45,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}

function collision(a,b){
  return Math.abs(a.x-b.x)<34&&Math.abs(a.y-b.y)<54;
}

function gameOver(){
  running=false;
  sound(110,.4,"sawtooth",.08);
  $("message").textContent="💥 Crash! Score: "+Math.floor(score);
  if(score>best){
    best=Math.floor(score);
    localStorage.setItem("starkBest",best);
    $("message").textContent="🏆 NEUER HIGHSCORE: "+best+"!";
  }
  updateStats();
}

function frame(time){
  const dt=Math.min((time-lastTime)/16.67||1,2);
  lastTime=time;

  if(running){
    const boost=nitroTime>0?2.1:1;
    if(nitroTime>0)nitroTime-=dt;
    speed=(4+level*.35)*boost;
    roadOffset+=speed*dt;
    score+=speed*.08*dt;
    level=1+Math.floor(score/250);

    spawnTimer+=dt;
    if(spawnTimer>Math.max(20,62-level*3)){
      spawnTraffic();spawnTimer=0;
    }

    for(const t of traffic){
      t.y+=speed*dt;
      if(collision({x:lanes[player.lane],y:player.y},t)){
        gameOver();break;
      }
    }
    traffic=traffic.filter(t=>t.y<660);
    updateStats();
  }

  drawBackground();
  animation=requestAnimationFrame(frame);
}

function startGame(){
  cancelAnimationFrame(animation);
  player.lane=1;
  traffic=[];particles=[];
  score=0;level=1;speed=4;nitroTime=0;spawnTimer=0;
  running=true;
  $("message").textContent="🏁 Los geht's!";
  sound(650,.15);
  lastTime=performance.now();
  animation=requestAnimationFrame(frame);
}

function move(direction){
  if(!running)return;
  player.lane=Math.max(0,Math.min(2,player.lane+direction));
  sound(300,.04,"square",.02);
}

function useNitro(){
  if(!running||nitroTime>0)return;
  nitroTime=85;
  $("message").textContent="⚡ NITRO AKTIV!";
  sound(850,.22,"sawtooth",.06);
}

$("start").addEventListener("click",startGame);
$("nitro").addEventListener("click",useNitro);
$("left").addEventListener("click",()=>move(-1));
$("right").addEventListener("click",()=>move(1));
$("brake").addEventListener("click",()=>{
  if(running){score=Math.max(0,score-3);sound(180,.08);}
});

document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," ","ArrowUp"].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
  if(e.key===" "||e.key==="ArrowUp")useNitro();
  if(e.key==="Enter"&&!running)startGame();
});

drawBackground();
animation=requestAnimationFrame(frame);
</script>
</body>
</html>
