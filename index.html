
<!DOCTYPE html>
<html lang="de">
<head>
 
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00eaff">
<meta name="description" content="STARK RACING – ein neonbeleuchtetes Rennspiel mit Nitro, Verkehr und Boss-Rennen.">
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STARK RACING</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;background:#03040b;color:#eafcff;
 font-family:Arial,sans-serif;text-align:center;
 -webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}
h1{margin:12px 0 4px;color:#00eaff;letter-spacing:5px;text-shadow:0 0 8px #00eaff,0 0 25px #0077ff}
#info{display:flex;justify-content:space-around;gap:4px;flex-wrap:wrap;margin:8px auto;max-width:480px;font-size:13px}
.stat{background:#0b1020;border:1px solid #00bfff;border-radius:8px;padding:8px;box-shadow:0 0 8px #0066aa}
#game{display:block;width:min(100vw,480px);height:auto;margin:auto;border:2px solid #00d9ff;box-shadow:0 0 18px #0077ff;background:#080b16;touch-action:none}
#message{min-height:22px;color:#ff42ed;margin:7px;font-weight:bold;text-shadow:0 0 8px #ff00d9}
button{
 background:#091528;color:#eafcff;border:1px solid #00eaff;
 border-radius:9px;padding:12px 15px;font-size:15px;font-weight:bold;
 box-shadow:0 0 10px #0077ff;touch-action:none;
 -webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button:active{background:#064c70;transform:scale(.96)}
#controls{max-width:480px;margin:8px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 5px;touch-action:none}
#controls button{padding:17px 2px}
#start{margin:5px 0 10px;background:#061b2a}
small{color:#94cbd9}
</style>
</head>
<body>
<h1>STARK RACING</h1>
<div id="info">
 <div class="stat">LEVEL <b id="level">1</b></div>
 <div class="stat">SPEED <b id="speed">0</b></div>
 <div class="stat">NITRO <b id="nitro">100%</b></div>
 <div class="stat">DISTANZ <b id="distance">0</b> m</div>
</div>
<canvas id="game" width="480" height="700"></canvas>
<div id="message">BEREIT FÜR DAS RENNEN?</div>
<button id="start">▶ RENNEN STARTEN</button>
<div id="controls">
 <button data-key="left">◀ LINKS</button>
 <button data-key="brake">▼ BREMSEN</button>
 <button data-key="nitro">⚡ NITRO</button>
 <button data-key="right">RECHTS ▶</button>
</div>
<small>PC: ← → steuern · ↓ bremsen · Leertaste = Nitro</small>

<script>
"use strict";
const canvas=document.getElementById("game");
const g=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=480,H=700;
const road={left:55,right:425};
const player={x:218,y:530,w:44,h:78};
let level=1,distance=0,speed=0,nitro=100;
let running=false,finished=false,gameOver=false;
let roadOffset=0,spawnTimer=0,nitroTime=0;
let traffic=[];
let lastTime=0;
const keys={left:false,right:false,brake:false,nitro:false};
let audio=null,engineOsc=null,engineGain=null;

function isBoss(){return level%3===0}
function levelLength(){return isBoss()?300000:200000}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function random(a,b){return a+Math.random()*(b-a)}

function soundStart(){
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  if(!engineOsc){
   engineOsc=audio.createOscillator();
   engineGain=audio.createGain();
   engineOsc.type="sawtooth";
   engineGain.gain.value=0.012;
   engineOsc.connect(engineGain);
   engineGain.connect(audio.destination);
   engineOsc.start();
  }
 }catch(e){}
}
function beep(freq=600,duration=.12,type="sine"){
 if(!audio)return;
 try{
  const o=audio.createOscillator(),v=audio.createGain();
  o.type=type;o.frequency.value=freq;
  v.gain.setValueAtTime(.08,audio.currentTime);
  v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(v);v.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function drawRoad(){
 g.fillStyle="#050713";g.fillRect(0,0,W,H);
 for(let y=-70;y<H+80;y+=85){
  const yy=((y+roadOffset*.65)%850+850)%850-70;
  for(const x of [8,436]){
   g.fillStyle="#10132b";g.fillRect(x,yy,36,48);
   g.strokeStyle="#ff00d9";g.lineWidth=1;
   g.shadowColor="#ff00d9";g.shadowBlur=8;
   g.strokeRect(x,yy,36,48);
   g.fillStyle="#00eaff";
   g.fillRect(x+7,yy+8,5,12);g.fillRect(x+22,yy+8,5,12);
  }
 }
 g.fillStyle="#101321";g.fillRect(road.left,0,road.right-road.left,H);
 const grad=g.createLinearGradient(road.left,0,road.right,0);
 grad.addColorStop(0,"#17182b");grad.addColorStop(.5,"#0a0d19");grad.addColorStop(1,"#17182b");
 g.fillStyle=grad;g.fillRect(road.left,0,road.right-road.left,H);
 g.save();g.shadowBlur=18;g.shadowColor="#00eaff";g.fillStyle="#00eaff";
 g.fillRect(road.left,0,4,H);g.fillRect(road.right-4,0,4,H);g.restore();
 g.save();g.shadowBlur=12;g.shadowColor="#008cff";
 for(let lane=1;lane<=2;lane++){
  for(let y=-90;y<H+90;y+=95){
   const yy=((y+roadOffset)%95+95)%95-95;
   g.fillStyle="#00bfff";
   g.fillRect(road.left+lane*(road.right-road.left)/3-2,yy,4,48);
  }
 }
 g.restore();
 g.save();g.shadowBlur=12;g.shadowColor="#ff00d9";g.fillStyle="#ff00d9";
 for(let y=-50;y<H+70;y+=75){
  const yy=((y+roadOffset)%75+75)%75-75;
  g.fillRect(road.left-9,yy,4,25);g.fillRect(road.right+5,yy,4,25);
 }
 g.restore();
}

function drawCar(x,y,w,h,col,hero=false){
 g.save();
 g.fillStyle="rgba(0,0,0,.45)";
 g.beginPath();g.ellipse(x+w/2,y+h/2,w*.72,h*.48,0,0,Math.PI*2);g.fill();
 g.fillStyle="#020308";
 g.fillRect(x-4,y+h*.2,7,h*.23);g.fillRect(x+w-3,y+h*.2,7,h*.23);
 g.fillRect(x-4,y+h*.61,7,h*.23);g.fillRect(x+w-3,y+h*.61,7,h*.23);
 g.shadowColor=hero?"#00eaff":col;g.shadowBlur=hero?20:10;g.fillStyle=col;
 g.beginPath();
 g.moveTo(x+w*.5,y);g.lineTo(x+w*.77,y+h*.09);
 g.lineTo(x+w*.94,y+h*.29);g.lineTo(x+w*.98,y+h*.69);
 g.lineTo(x+w*.79,y+h*.94);g.lineTo(x+w*.65,y+h);
 g.lineTo(x+w*.35,y+h);g.lineTo(x+w*.21,y+h*.94);
 g.lineTo(x+w*.02,y+h*.69);g.lineTo(x+w*.06,y+h*.29);
 g.lineTo(x+w*.23,y+h*.09);g.closePath();g.fill();
 g.shadowBlur=0;g.fillStyle="#080e20";
 g.beginPath();g.moveTo(x+w*.23,y+h*.25);g.lineTo(x+w*.77,y+h*.25);
 g.lineTo(x+w*.69,y+h*.47);g.lineTo(x+w*.31,y+h*.47);g.closePath();g.fill();
 g.fillStyle=hero?"#5eeaff":"#25455d";
 g.beginPath();g.moveTo(x+w*.29,y+h*.27);g.lineTo(x+w*.71,y+h*.27);
 g.lineTo(x+w*.65,y+h*.43);g.lineTo(x+w*.35,y+h*.43);g.closePath();g.fill();
 g.fillStyle="#07101d";
 g.beginPath();g.moveTo(x+w*.31,y+h*.53);g.lineTo(x+w*.69,y+h*.53);
 g.lineTo(x+w*.76,y+h*.72);g.lineTo(x+w*.24,y+h*.72);g.closePath();g.fill();
 g.fillStyle="#080a13";g.fillRect(x+w*.12,y+h*.79,w*.76,4);
 g.save();g.shadowBlur=12;g.shadowColor="#fff7b0";g.fillStyle="#fff7b0";
 g.fillRect(x+w*.13,y+h*.08,w*.23,4);g.fillRect(x+w*.64,y+h*.08,w*.23,4);g.restore();
 g.fillStyle="#ff174d";g.fillRect(x+w*.13,y+h*.89,w*.23,4);g.fillRect(x+w*.64,y+h*.89,w*.23,4);
 if(hero){g.strokeStyle="#a5ffff";g.lineWidth=1.5;g.shadowColor="#00eaff";g.shadowBlur=16;g.stroke()}
 g.restore();
}

function spawnCar(){
 const laneX=[road.left+65,road.left+(road.right-road.left)/2,road.right-65];
 const x=laneX[Math.floor(Math.random()*laneX.length)]-20;
 const colors=["#ff174d","#ff00d9","#ffc400","#8b5cff","#00ff9d"];
 traffic.push({x,y:-100,w:40,h:72,color:colors[Math.floor(Math.random()*colors.length)],speed:random(7,17)});
}

function update(dt){
 if(!running)return;
 if(keys.nitro&&nitro>0&&nitroTime<=0&&speed>5){
  nitroTime=2.2;nitro=Math.max(0,nitro-22);beep(950,.25,"sawtooth");
 }
 nitroTime=Math.max(0,nitroTime-dt);
 if(keys.brake)speed=Math.max(0,speed-35*dt);
 else speed=Math.min(nitroTime>0?75:52,speed+(nitroTime>0?55:28)*dt);
 if(nitroTime<=0)nitro=Math.min(100,nitro+5*dt);
 if(engineOsc&&audio)engineOsc.frequency.setTargetAtTime(65+speed*8,audio.currentTime,.08);
 if(keys.left)player.x-=260*dt;
 if(keys.right)player.x+=260*dt;
 player.x=clamp(player.x,road.left+8,road.right-player.w-8);
 roadOffset=(roadOffset+speed*9*dt)%95;
 distance+=speed*dt*55;
 spawnTimer-=dt;
 if(spawnTimer<=0){spawnCar();spawnTimer=random(.65,1.2)*Math.max(.55,1-speed/100)}
 traffic=traffic.filter(c=>c.y<H+120);
 for(const c of traffic){
  c.y+=(speed+c.speed)*dt*7;
  if(player.x<c.x+c.w-7&&player.x+player.w>c.x+7&&player.y<c.y+c.h-8&&player.y+player.h>c.y+8){
   running=false;gameOver=true;speed=0;
   $("message").textContent="CRASH! NOCH EIN VERSUCH?";
   beep(120,.5,"sawtooth");$("start").textContent="↻ ERNEUT VERSUCHEN";
   return;
  }
 }
 if(distance>=levelLength()){
  distance=levelLength();running=false;finished=true;speed=0;
  $("message").textContent="LEVEL "+level+" GESCHAFFT! ✨";
  $("start").textContent="▶ LEVEL "+(level+1)+" STARTEN";
  beep(880,.25);setTimeout(()=>beep(1100,.3),180);
 }
 updateUI();
}

function draw(){
 drawRoad();
 for(const c of traffic)drawCar(c.x,c.y,c.w,c.h,c.color,false);
 if(nitroTime>0){
  g.save();g.shadowBlur=20;g.shadowColor="#00eaff";
  for(const x of [player.x+10,player.x+player.w-10]){
   g.fillStyle=Math.random()>.5?"#00eaff":"#ff00d9";
   g.beginPath();g.moveTo(x-4,player.y+player.h-1);
   g.lineTo(x+4,player.y+player.h-1);
   g.lineTo(x,player.y+player.h+random(12,35));g.closePath();g.fill();
  }
  g.restore();
 }
 drawCar(player.x,player.y,player.w,player.h,"#075dff",true);
 if(isBoss()){
  g.fillStyle="#1a0b24";g.fillRect(100,12,280,20);
  g.strokeStyle="#ff00d9";g.strokeRect(100,12,280,20);
  g.fillStyle="#ff00d9";g.fillRect(103,15,274,14);
  g.fillStyle="#fff";g.font="bold 12px Arial";g.textAlign="center";
  g.fillText("BOSS RACE",240,48);
 }
 if(!running){
  g.fillStyle="rgba(0,0,0,.58)";g.fillRect(55,280,370,100);
  g.textAlign="center";g.font="bold 25px Arial";
  g.fillStyle=finished?"#00ffcc":"#00eaff";
  g.shadowColor=g.fillStyle;g.shadowBlur=14;
  g.fillText(finished?"LEVEL GESCHAFFT":gameOver?"CRASH!":"STARK RACING",240,320);
  g.shadowBlur=0;g.font="16px Arial";g.fillStyle="#fff";
  g.fillText(finished?"Bereit für das nächste Rennen?":gameOver?"Drücke Neustart!":"Drücke Start zum Losfahren",240,350);
 }
}

function updateUI(){
 $("level").textContent=level+(isBoss()?" 👑":"");
 $("speed").textContent=Math.round(speed*4)+" km/h";
 $("nitro").textContent=Math.round(nitro)+"%";
 $("distance").textContent=Math.floor(distance).toLocaleString("de-DE");
}

function loop(time){
 const dt=Math.min((time-lastTime)/1000||0,0.04);
 lastTime=time;update(dt);draw();requestAnimationFrame(loop);
}

function startGame(){
 soundStart();
 if(finished)level++;
 distance=0;speed=0;nitro=100;nitroTime=0;
 traffic=[];spawnTimer=.5;player.x=218;
 finished=false;gameOver=false;running=true;
 $("message").textContent=isBoss()?"👑 BOSSRENNEN!":"🚦 RENNEN LÄUFT!";
 $("start").textContent="⏸ PAUSE";updateUI();
}
$("start").addEventListener("click",()=>{
 if(running){running=false;$("message").textContent="PAUSE";$("start").textContent="▶ WEITER"}
 else startGame();
});

// Touch-Steuerung: kein Markieren und zuverlässiges Loslassen
function setKey(k,v){keys[k]=v}
document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("contextmenu",e=>e.preventDefault());
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();soundStart();setKey(k,true);
  try{btn.setPointerCapture(e.pointerId)}catch(_){}
 });
 const release=e=>{e.preventDefault();setKey(k,false)};
 btn.addEventListener("pointerup",release);
 btn.addEventListener("pointercancel",release);
 btn.addEventListener("lostpointercapture",()=>setKey(k,false));
});

window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowDown"," ","ArrowUp"].includes(e.key))e.preventDefault();
 soundStart();
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key==="ArrowDown")keys.brake=true;
 if(e.key===" ")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.key==="ArrowDown")keys.brake=false;
 if(e.key===" ")keys.nitro=false;
});
window.addEventListener("blur",()=>{for(const k in keys)keys[k]=false});

updateUI();draw();requestAnimationFrame(loop);
</script>
</body>
 
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(
      "/Stark-Racing/service-worker.js"
    ).catch(console.error);
  });
}
</script>
 
</html>
