<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#00eaff">
<meta name="description" content="STARK RACING – Neon-Rennen mit Nitro, Verkehr und Bossrennen.">
<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: #03040b;
  color: #eafcff;
  font-family: Arial, sans-serif;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

h1 {
  margin: 12px 0 4px;
  color: #00eaff;
  letter-spacing: 4px;
  text-shadow: 0 0 15px #00eaff;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 5px;
  margin: 9px auto;
  max-width: 480px;
  font-size: 13px;
}

.stat {
  padding: 8px;
  background: #0b1020;
  border: 1px solid #00bfff;
  border-radius: 8px;
}

#game {
  display: block;
  width: min(100%, 480px);
  height: auto;
  margin: auto;
  border: 2px solid #00d9ff;
  box-shadow: 0 0 18px #0077ff;
  touch-action: none;
}

#message {
  min-height: 24px;
  color: #ff42ed;
  margin: 8px;
  font-weight: bold;
}

button {
  background: #091528;
  color: #eafcff;
  border: 1px solid #00eaff;
  border-radius: 9px;
  padding: 12px 10px;
  font-size: 14px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

button:active {
  background: #064c70;
  transform: scale(.97);
}

#start {
  margin: 5px 0 10px;
}

#controls {
  max-width: 480px;
  margin: 8px auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;

}

#controls button {
  padding: 17px 2px;
}

small {
  color: #94cbd9;
}
</style>
</head>

<body>

<h1>STARK RACING</h1>

<div id="info">
  <div class="stat">LEVEL <b id="level">1</b></div>
  <div class="stat">SPEED <b id="speed">0</b></div>
  <div class="stat">NITRO <b id="nitro">100%</b></div>
  <div class="stat">DISTANZ <b id="distance">0</b> m</div>
</div>

<canvas id="game" width="480" height="700"></canvas>

<div id="message">BEREIT FÜR DAS RENNEN?</div>

<button id="start">▶ RENNEN STARTEN</button>

<div id="controls">
  <button data-key="left">◀ LINKS</button>
  <button data-key="brake">▼ BREMSEN</button>
  <button data-key="nitro">⚡ NITRO</button>
  <button data-key="right">RECHTS ▶</button>
</div>

<small>
  PC: ← → steuern · ↓ bremsen · Leertaste Nitro · Esc Pause
</small>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

const W = 480;
const H = 700;

const CONFIG = {
  roadWidth: 360,
  normalDistance: 200000,
  bossDistance: 300000,
  playerWidth: 44,
  playerHeight: 78,
  playerSpeed: 260,
  normalMaxSpeed: 52,
  nitroMaxSpeed: 75,
  trafficMin: 7,
  trafficMax: 17
};

const road = {
  get left() {
    return (W - CONFIG.roadWidth) / 2;
  },
  get right() {
    return (W + CONFIG.roadWidth) / 2;
  }
};

const player = {
  x: 218,
  y: 530,
  w: 44,
  h: 78
};

const keys = {
  left: false,
  right: false,
  brake: false,
  nitro: false
};

let level = 1;
let distance = 0;
let speed = 0;
let nitro = 100;

let running = false;
let paused = false;
let finished = false;
let gameOver = false;

let roadOffset = 0;
let spawnTimer = 0;
let nitroTime = 0;

let traffic = [];
let lastTime = 0;

let audio = null;
let engineOsc = null;
let engineGain = null;

const clamp = (n, min, max) =>
  Math.max(min, Math.min(max, n));

const random = (min, max) =>
  min + Math.random() * (max - min);

const isBoss = () => level % 3 === 0;

const levelLength = () =>
  isBoss()
    ? CONFIG.bossDistance
    : CONFIG.normalDistance;


// ==============================
// SOUND
// ==============================

function soundStart() {
  try {
    if (!audio) {
      audio = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if (audio.state === "suspended") {
      audio.resume();
    }

    if (!engineOsc) {
      engineOsc = audio.createOscillator();
      engineGain = audio.createGain();

      engineOsc.type = "sawtooth";
      engineGain.gain.value = 0.008;

      engineOsc.connect(engineGain);
      engineGain.connect(audio.destination);

      engineOsc.start();
    }
  } catch (e) {}
}

function beep(freq = 600, duration = 0.12) {
  if (!audio) return;

  try {
    const o = audio.createOscillator();
    const v = audio.createGain();

    o.type = "sine";
    o.frequency.value = freq;

    v.gain.setValueAtTime(
      0.07,
      audio.currentTime
    );

    v.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + duration
    );

    o.connect(v);
    v.connect(audio.destination);

    o.start();
    o.stop(audio.currentTime + duration);
  } catch (e) {}
}


// ==============================
// STRASSE ZEICHNEN
// ==============================

function drawRoad() {
  ctx.fillStyle = "#050713";
  ctx.fillRect(0, 0, W, H);

  // Gebäude neben der Straße
  for (let y = -70; y < H + 80; y += 85) {
    const yy =
      ((y + roadOffset * 0.65) % 850 + 850) % 850 - 70;

    for (const x of [8, 436]) {
      ctx.fillStyle = "#10132b";
      ctx.fillRect(x, yy, 36, 48);

      ctx.strokeStyle = "#ff00d9";
      ctx.shadowColor = "#ff00d9";
      ctx.shadowBlur = 8;
      ctx.strokeRect(x, yy, 36, 48);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#00eaff";
      ctx.fillRect(x + 7, yy + 8, 5, 12);
      ctx.fillRect(x + 22, yy + 8, 5, 12);
    }
  }

  // Straßenfläche
  ctx.fillStyle = "#101321";
  ctx.fillRect(
    road.left,
    0,
    CONFIG.roadWidth,
    H
  );

  const grad = ctx.createLinearGradient(
    road.left, 0,
    road.right, 0
  );

  grad.addColorStop(0, "#17182b");
  grad.addColorStop(0.5, "#0a0d19");
  grad.addColorStop(1, "#17182b");

  ctx.fillStyle = grad;
  ctx.fillRect(
    road.left,
    0,
    CONFIG.roadWidth,
    H
  );

  // Leuchtende Straßenränder
  ctx.save();
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00eaff";
  ctx.fillStyle = "#00eaff";

  ctx.fillRect(road.left, 0, 4, H);
  ctx.fillRect(road.right - 4, 0, 4, H);

  ctx.restore();

  // Fahrbahnmarkierungen
  ctx.save();
  ctx.shadowBlur = 10;
  ctx.shadowColor = "#008cff";
  ctx.fillStyle = "#00bfff";

  for (let lane = 1; lane <= 2; lane++) {
    for (let y = -95; y < H + 95; y += 95) {
      const yy =
        ((y + roadOffset) % 95 + 95) % 95 - 95;

      ctx.fillRect(
        road.left +
          lane * CONFIG.roadWidth / 3 - 2,
        yy,
        4,
        48
      );
    }
  }

  ctx.restore();

  // Pinke Randmarkierungen
  ctx.save();
  ctx.shadowBlur = 10;
  ctx.shadowColor = "#ff00d9";
  ctx.fillStyle = "#ff00d9";

  for (let y = -75; y < H + 75; y += 75) {
    const yy =
      ((y + roadOffset) % 75 + 75) % 75 - 75;

    ctx.fillRect(road.left - 9, yy, 4, 25);
    ctx.fillRect(road.right + 5, yy, 4, 25);
  }

  ctx.restore();
}


// ==============================
// AUTOS ZEICHNEN
// ==============================

function drawCar(x, y, w, h, col, hero = false) {
  ctx.save();

  // Schatten
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.beginPath();

  ctx.ellipse(
    x + w / 2,
    y + h / 2,
    w * 0.72,
    h * 0.48,
    0, 0, Math.PI * 2
  );

  ctx.fill();

  // Reifen
  ctx.fillStyle = "#020308";

  for (const yy of [0.2, 0.61]) {
    ctx.fillRect(x - 4, y + h * yy, 7, h * 0.23);
    ctx.fillRect(x + w - 3, y + h * yy, 7, h * 0.23);
  }

  // Karosserie
  ctx.shadowColor = hero ? "#00eaff" : col;
  ctx.shadowBlur = hero ? 20 : 10;
  ctx.fillStyle = col;

  ctx.beginPath();
  ctx.moveTo(x + w * 0.5, y);
  ctx.lineTo(x + w * 0.77, y + h * 0.09);
  ctx.lineTo(x + w * 0.94, y + h * 0.29);
  ctx.lineTo(x + w * 0.98, y + h * 0.69);
  ctx.lineTo(x + w * 0.79, y + h * 0.94);
  ctx.lineTo(x + w * 0.65, y + h);
  ctx.lineTo(x + w * 0.35, y + h);
  ctx.lineTo(x + w * 0.21, y + h * 0.94);
  ctx.lineTo(x + w * 0.02, y + h * 0.69);
  ctx.lineTo(x + w * 0.06, y + h * 0.29);
  ctx.lineTo(x + w * 0.23, y + h * 0.09);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // Windschutzscheibe
  ctx.fillStyle = "#080e20";
  ctx.beginPath();
  ctx.moveTo(x + w * 0.23, y + h * 0.25);
  ctx.lineTo(x + w * 0.77, y + h * 0.25);
  ctx.lineTo(x + w * 0.69, y + h * 0.47);
  ctx.lineTo(x + w * 0.31, y + h * 0.47);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = hero ? "#5eeaff" : "#25455d";

  ctx.beginPath();
  ctx.moveTo(x + w * 0.29, y + h * 0.27);
  ctx.lineTo(x + w * 0.71, y + h * 0.27);
  ctx.lineTo(x + w * 0.65, y + h * 0.43);
  ctx.lineTo(x + w * 0.35, y + h * 0.43);
  ctx.closePath();
  ctx.fill();

  // Unterer Karosseriebereich
  ctx.fillStyle = "#07101d";
  ctx.beginPath();
  ctx.moveTo(x + w * 0.31, y + h * 0.53);
  ctx.lineTo(x + w * 0.69, y + h * 0.53);
  ctx.lineTo(x + w * 0.76, y + h * 0.72);
  ctx.lineTo(x + w * 0.24, y + h * 0.72);
  ctx.closePath();
  ctx.fill();

  // Scheinwerfer
  ctx.fillStyle = "#fff7b0";
  ctx.fillRect(x + w * 0.13, y + h * 0.08, w * 0.23, 4);
  ctx.fillRect(x + w * 0.64, y + h * 0.08, w * 0.23, 4);

  // Rücklichter
  ctx.fillStyle = "#ff174d";
  ctx.fillRect(x + w * 0.13, y + h * 0.89, w * 0.23, 4);
  ctx.fillRect(x + w * 0.64, y + h * 0.89, w * 0.23, 4);

  if (hero) {
    ctx.strokeStyle = "#a5ffff";
    ctx.lineWidth = 1.5;
    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 16;
    ctx.stroke();
  }

  ctx.restore();
}


// ==============================
// VERKEHR
// ==============================

function spawnCar() {
  const laneWidth = CONFIG.roadWidth / 3;
  const lane = Math.floor(Math.random() * 3);

  const w = 40;
  const h = 72;

  const x =
    road.left +
    laneWidth * lane +
    (laneWidth - w) / 2;

  const blocked = traffic.some(c =>
    Math.abs(c.x - x) < w && c.y < 150
  );

  if (blocked) return;

  traffic.push({
    x,
    y: -h - 10,
    w,
    h,
    color: [
      "#ff174d",
      "#ff00d9",
      "#ffc400",
      "#8b5cff",
      "#00ff9d"
    ][Math.floor(Math.random() * 5)],
    speed: random(
      CONFIG.trafficMin,
      CONFIG.trafficMax
    )
  });
}


// ==============================
// KOLLISIONEN
// ==============================

function collides(a, b) {
  const ax = a.x + a.w * 0.16;
  const aw = a.w * 0.68;
  const ay = a.y + a.h * 0.10;
  const ah = a.h * 0.80;

  const bx = b.x + b.w * 0.12;
  const bw = b.w * 0.76;
  const by = b.y + b.h * 0.10;
  const bh = b.h * 0.80;

  return (
    ax < bx + bw &&
    ax + aw > bx &&
    ay < by + bh &&
    ay + ah > by
  );
}

function clearKeys() {
  for (const k in keys) {
    keys[k] = false;
  }
}


// ==============================
// CRASH
// ==============================

function crash(
  message = "💥 CRASH! NOCH EIN VERSUCH?"
) {
  running = false;
  paused = false;
  gameOver = true;
  speed = 0;
  nitroTime = 0;

  clearKeys();

  $("message").textContent = message;
  $("start").textContent = "↻ ERNEUT VERSUCHEN";

  beep(120, 0.4);
}


// ==============================
// SPIELLOGIK
// ==============================

function update(dt) {
  if (!running) return;

  // Nitro aktivieren
  if (
    keys.nitro &&
    nitro > 0 &&
    nitroTime <= 0 &&
    speed > 5
  ) {
    nitroTime = 2.2;
    nitro = Math.max(0, nitro - 22);
    beep(950, 0.2);
  }

  nitroTime = Math.max(0, nitroTime - dt);

  // Bremsen und Beschleunigen
  if (keys.brake) {
    speed = Math.max(0, speed - 35 * dt);
  } else {
    speed = Math.min(
      nitroTime > 0
        ? CONFIG.nitroMaxSpeed
        : CONFIG.normalMaxSpeed,
      speed + (nitroTime > 0 ? 55 : 28) * dt
    );
  }

  // Nitro
