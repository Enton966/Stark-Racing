
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK RACING 4.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial,sans-serif;text-align:center}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff;margin:12px 0}
#hud{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px}
.stat{background:#141d32;border:1px solid #00eaff;border-radius:8px;padding:9px;font-weight:bold}
#game{display:block;width:min(96vw,500px);height:auto;margin:5px auto;background:#111;border:3px solid #00eaff;border-radius:12px;touch-action:none}
#message{min-height:30px;color:#ffe45c;font-weight:bold;padding:6px}
#start{min-height:48px;padding:10px 22px;margin:6px;background:#14213b;color:white;border:2px solid #00eaff;border-radius:12px;font-size:17px;font-weight:bold}
.controls{width:min(96vw,500px);margin:8px auto 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.controls button{min-width:0;min-height:62px;padding:5px 1px;background:#14213b;color:white;border:2px solid #00eaff;border-radius:12px;font-size:clamp(11px,3vw,16px);font-weight:bold;touch-action:none}
.controls button:active,#start:active{background:#007b99}
#nitro{border-color:#ffb000;color:#ffe45c;box-shadow:0 0 12px #ff8c00}
</style>
</head>
<body>
<h1>🏎️ STARK RACING 4.1</h1>

<div id="hud">
 <div class="stat" id="level">Level: 1</div>
 <div class="stat" id="speed">Speed: 0</div>
 <div class="stat" id="score">Punkte: 0</div>
</div>

<canvas id="game" width="500" height="620"></canvas>
<div id="message">Drücke START und gib Gas!</div>
<button id="start">▶ START</button>

<!-- GAMING-PAD: ALLE KNÖPFE BLEIBEN UNTEN -->
<div class="controls">
 <button id="left">⬅️ LINKS</button>
 <button id="brake">🛑 BREMSE</button>
 <button id="right">RECHTS ➡️</button>
 <button id="nitro">⚡ NITRO</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const levelText=document.getElementById("level");
const speedText=document.getElementById("speed");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");
const startButton=document.getElementById("start");

const keys={left:false,right:false,brake:false};
const road={left:65,right:435};
const player={x:185,y:490,w:44,h:76};

let running=false,finished=false,level=1,score=0,speed=0;
let distance=0,roadOffset=0,nitroTime=0,lastTime=0;
let bossDistance=0,traffic=[],enemyX=325;

function isBoss(){return level%3===0}

function levelLength(){return isBoss()?15000:10000}

function updateHUD(){
 levelText.textContent="Level: "+level+(isBoss()?" 👹 BOSS":"");
 speedText.textContent="Speed: "+Math.round(speed);
 scoreText.textContent="Punkte: "+score;
}

function resetLevel(){
 speed=0;distance=0;bossDistance=0;nitroTime=0;
 roadOffset=0;player.x=185;enemyX=325;traffic=[];
 lastTime=0;finished=false;
}

function startGame(){
 if(running)return;
 if(finished){
  if(message.dataset.result==="win")level++;
  resetLevel();
 }
 running=true;finished=false;
 startButton.textContent="🏁 RENNEN LÄUFT";
 message.textContent=isBoss()?"👹 BOSSRENNEN! Besiege den Rivalen!":"🏁 Langes Rennen! Bleib auf der Strecke!";
 updateHUD();
 requestAnimationFrame(loop);
}

function endGame(won,text){
 running=false;finished=true;
 message.dataset.result=won?"win":"lose";
 message.textContent=text;
 startButton.textContent=won?"➡️ NÄCHSTES LEVEL":"🔄 NOCHMAL VERSUCHEN";
}

function drawCar(x,y,color,label){
 ctx.save();
 ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=12;
 ctx.fillRect(x,y,44,76);ctx.shadowBlur=0;
 ctx.fillStyle="#111827";
 ctx.fillRect(x+7,y+12,30,19);ctx.fillRect(x+7,y+43,30,16);
 ctx.fillStyle="#fff";
 ctx.fillRect(x+3,y+3,8,5);ctx.fillRect(x+33,y+3,8,5);
 ctx.fillStyle="#ff3030";
 ctx.fillRect(x+3,y+66,8,6);ctx.fillRect(x+33,y+66,8,6);
 ctx.fillStyle="white";ctx.font="bold 11px Arial";ctx.textAlign="center";
 ctx.fillText(label,x+22,y+40);ctx.restore();
}

function drawRoad(){
 ctx.fillStyle="#123a26";ctx.fillRect(0,0,500,620);
 ctx.fillStyle="#343943";ctx.fillRect(road.left,0,370,620);
 ctx.fillStyle="white";ctx.fillRect(road.left,0,5,620);ctx.fillRect(road.right-5,0,5,620);
 ctx.strokeStyle="#ddd";ctx.lineWidth=5;
 ctx.setLineDash([35,30]);ctx.lineDashOffset=-roadOffset;
 ctx.beginPath();ctx.moveTo(250,0);ctx.lineTo(250,620);ctx.stroke();ctx.setLineDash([]);
 if(isBoss()){
  ctx.fillStyle="#ff3155";ctx.font="bold 16px Arial";ctx.textAlign="center";
  ctx.fillText("BOSSRENNEN",250,25);
  ctx.fillStyle="#40101a";ctx.fillRect(110,42,280,12);
  ctx.fillStyle="#ff3155";
  ctx.fillRect(110,42,280*Math.min(1,bossDistance/levelLength()),12);
 }
}

function draw(){
 drawRoad();
 drawCar(player.x,player.y,"#00d9ff","YOU");
 if(isBoss())drawCar(enemyX,235,"#ff3155","BOSS");
 for(const t of traffic)drawCar(t.x,t.y,"#ffb52e","!");
}

function spawnTraffic(){
 if(Math.random()<Math.min(.035,.012+level*.001)){
  const lanes=[85,145,265,325,365];
  traffic.push({x:lanes[Math.floor(Math.random()*lanes.length)],y:-90});
 }
}

function loop(time){
 if(!running)return;
 const dt=lastTime?Math.min((time-lastTime)/16.67,2):1;
 lastTime=time;

 const maxSpeed=5+level*.2;
 if(keys.brake)speed=Math.max(0,speed-.12*dt);
 else speed=Math.min(maxSpeed,speed+.035*dt);
 if(nitroTime>0){
  speed=Math.min(maxSpeed+4,speed+.16*dt);
  nitroTime-=dt;
 }

 if(keys.left)player.x-=5*dt;
 if(keys.right)player.x+=5*dt;
 player.x=Math.max(road.left+5,Math.min(road.right-player.w-5,player.x));

 roadOffset+=speed*4*dt;
 distance+=speed*dt;
 score+=Math.floor(speed*dt);

 if(isBoss()){
  bossDistance+=(1.1+level*.08)*dt;
  enemyX=280+Math.sin(time/350)*65;
 }

 spawnTraffic();
 for(const t of traffic)t.y+=(speed+2)*dt;
 traffic=traffic.filter(t=>t.y<700);

 for(const t of traffic){
  if(player.x<t.x+44&&player.x+player.w>t.x&&player.y<t.y+76&&player.y+player.h>t.y){
   endGame(false,"💥 Crash! Versuch es nochmal!");
   draw();return;
  }
 }

 if(distance>=levelLength()){
  endGame(true,isBoss()?"🏆 Bossrennen gewonnen!":"🏁 Level geschafft! Stark gefahren!");
 }else if(isBoss()&&bossDistance>=levelLength()){
  endGame(false,"👹 Der Boss war schneller! Versuch es erneut!");
 }

 updateHUD();draw();
 if(running)requestAnimationFrame(loop);
}

function bindHold(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",release);
}

bindHold("left","left");
bindHold("right","right");
bindHold("brake","brake");

document.getElementById("nitro").addEventListener("pointerdown",e=>{
 e.preventDefault();if(running)nitroTime=100;
});
startButton.addEventListener("click",startGame);

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="arrowleft"||k==="a")keys.left=true;
 if(k==="arrowright"||k==="d")keys.right=true;
 if(k==="arrowdown"||k===" ")keys.brake=true;
 if(k==="arrowup"||k==="w"){if(running)nitroTime=100}
});
document.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k==="arrowleft"||k==="a")keys.left=false;
 if(k==="arrowright"||k==="d")keys.right=false;
 if(k==="arrowdown"||k===" ")keys.brake=false;
});

draw();updateHUD();
</script>
</body>
</html>
