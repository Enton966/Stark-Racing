
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARK RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d16;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:14px;background:#111b2b;border-bottom:2px solid #00d9ff}
h1{margin:0;color:#00d9ff;letter-spacing:4px}
#hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;padding:12px;font-weight:bold}
canvas{display:block;width:min(100%,480px);height:auto;margin:auto;background:#252a31;border:2px solid #00d9ff}
button{border:0;border-radius:10px;padding:14px 18px;margin:5px;background:#172b43;color:white;font-weight:bold;font-size:16px;touch-action:manipulation}
button:active{background:#00a8ce}
#nitro{background:#e65a17}
#start{background:#00a8ce;color:#00121a}
#controls{max-width:480px;margin:8px auto}
#message{min-height:24px;color:#00d9ff;font-weight:bold;padding:5px}
</style>
</head>
<body>
<header><h1>STARK RACING</h1><div>ARCADE RACING SYSTEM</div></header>
<div id="hud">
 <span id="level">LEVEL 1</span>
 <span id="speed">0 KM/H</span>
 <span id="distance">0 / 1000 m</span>
 <span id="score">SCORE 0</span>
</div>
<canvas id="game" width="480" height="700"></canvas>
<div id="message">Bereit für das Rennen?</div>
<div id="controls">
 <div>
  <button id="left">⬅ LINKS</button>
  <button id="right">RECHTS ➡</button>
 </div>
 <div>
  <button id="brake">🛑 BREMSEN</button>
  <button id="nitro">⚡ NITRO</button>
 </div>
 <button id="start">🏁 RENNEN STARTEN</button>
 <button id="sound">🔊 SOUND: AN</button>
</div>
<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const keys={left:false,right:false,brake:false,nitro:false};
let running=false,finished=false;
let level=1,speed=0,distance=0,score=0,nitroTime=0;
let lastTime=0,roadOffset=0,spawnTimer=0;
let traffic=[];
let soundOn=true,audioCtx=null,engineOsc=null,engineGain=null;
let turboOsc=null,turboGain=null;

const player={x:218,y:535,w:44,h:78};
const road={left:65,right:415};
const isBoss=()=>level%3===0;
const levelLength=()=>1000;

function startSound(){
 if(!soundOn)return;
 if(!audioCtx){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  engineOsc=audioCtx.createOscillator();
  engineGain=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=500;
  engineOsc.type="sawtooth";
  engineOsc.frequency.value=65;
  engineGain.gain.value=0;
  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();

  turboOsc=audioCtx.createOscillator();
  turboGain=audioCtx.createGain();
  turboOsc.type="sawtooth";
  turboOsc.frequency.value=130;
  turboGain.gain.value=0;
  turboOsc.connect(turboGain);
  turboGain.connect(audioCtx.destination);
  turboOsc.start();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
}

function updateSound(){
 if(!audioCtx||!engineOsc)return;
 const now=audioCtx.currentTime;
 engineOsc.frequency.setTargetAtTime(55+speed*1.2,now,0.07);
 engineGain.gain.setTargetAtTime(
  running&&soundOn?0.07:0,now,0.08
 );
 turboOsc.frequency.setTargetAtTime(120+speed*2,now,0.07);
 turboGain.gain.setTargetAtTime(
  running&&soundOn&&nitroTime>0?0.035:0,now,0.06
 );
}

function resetGame(){
 speed=0;distance=0;nitroTime=0;spawnTimer=0;
 traffic=[];player.x=218;
 finished=false;running=true;
 $("message").textContent=isBoss()?"⚠️ BOSSRENNEN!":"GO! Viel Erfolg!";
 startSound();
 lastTime=performance.now();
 requestAnimationFrame(loop);
}

function startGame(){
 if(running)return;
 if(finished){level=1;score=0;}
 resetGame();
}

function nextLevel(){
 running=false;finished=true;speed=0;
 level++;
 $("message").textContent="LEVEL GESCHAFFT! 🏆";
 $("start").textContent="➡ LEVEL "+level+" STARTEN";
 draw();
 updateHUD();
}

function endRace(text){
 running=false;finished=true;speed=0;
 $("message").textContent=text;
 $("start").textContent="🔄 NOCHMAL FAHREN";
 draw();
 updateHUD();
}

function updateHUD(){
 $("level").textContent="LEVEL "+level+(isBoss()?" 👑":"");
 $("speed").textContent=Math.round(speed*2)+" KM/H";
 $("distance").textContent=Math.floor(distance)+" / "+levelLength()+" m";
 $("score").textContent="SCORE "+score;
}

function spawnTraffic(){
 const lanes=[105,175,245,315,375];
 const x=lanes[Math.floor(Math.random()*lanes.length)];
 traffic.push({
  x,y:-100,w:isBoss()?58:42,h:isBoss()?95:72,
  color:["#ff3030","#ffc928","#8a6bff","#f3f5fa"][Math.floor(Math.random()*4)],
  boss:isBoss()
 });
}

function update(dt){
 if(!running)return;
 const accel=keys.nitro&&nitroTime<=0;
 if(keys.nitro&&nitroTime<=0&&speed>15)nitroTime=1.8;
 if(nitroTime>0)nitroTime=Math.max(0,nitroTime-dt);

 const maxSpeed=nitroTime>0?44:31;
 if(keys.brake)speed=Math.max(0,speed-35*dt);
 else speed=Math.min(maxSpeed,speed+(nitroTime>0?34:16)*dt);

 if(keys.left)player.x-=250*dt;
 if(keys.right)player.x+=250*dt;
 player.x=Math.max(road.left+7,Math.min(road.right-player.w-7,player.x));

 distance+=speed*dt*2.3;
 roadOffset=(roadOffset+speed*dt*9)%100;
 spawnTimer-=dt;
 if(spawnTimer<=0){
  spawnTraffic();
  spawnTimer=isBoss()?1.1:Math.max(.55,1.5-speed/70);
 }

 for(const car of traffic){
  car.y+=(speed*0.7+12)*dt;
  if(!car.hit&&player.x<car.x+car.w&&player.x+player.w>car.x&&
     player.y<car.y+car.h&&player.y+player.h>car.y){
   car.hit=true;
   speed=Math.max(0,speed-14);
   score=Math.max(0,score-50);
   $("message").textContent="💥 Kollision! Pass auf!";
  }
 }
 traffic=traffic.filter(c=>c.y<canvas.height+120);
 score+=Math.floor(speed*dt);

 if(distance>=levelLength()){
  nextLevel();
 }
 updateHUD();
 updateSound();
}

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawCar(x,y,w,h,color,playerCar=false){
 roundedRect(x,y,w,h,9,color);
 roundedRect(x+w*.18,y+h*.17,w*.64,h*.22,"#9cecff");
 roundedRect(x+w*.16,y+h*.60,w*.68,h*.17,"#172333");
 ctx.fillStyle="#fff5ad";
 ctx.fillRect(x+4,y+5,8,5);
 ctx.fillRect(x+w-12,y+5,8,5);
 ctx.fillStyle="#ff3030";
 ctx.fillRect(x+4,y+h-8,8,5);
 ctx.fillRect(x+w-12,y+h-8,8,5);
 if(playerCar){
  ctx.strokeStyle="#00eaff";ctx.lineWidth=2;
  ctx.strokeRect(x-2,y-2,w+4,h+4);
 }
}

function draw(){
 ctx.clearRect(0,0,480,700);
 ctx.fillStyle="#22613c";ctx.fillRect(0,0,480,700);
 ctx.fillStyle="#30343b";ctx.fillRect(road.left,0,road.right-road.left,700);
 ctx.fillStyle="#fff";
 ctx.fillRect(road.left,0,5,700);
 ctx.fillRect(road.right-5,0,5,700);

 for(let y=-100;y<800;y+=100){
  const yy=(y+roadOffset)%800;
  ctx.fillStyle="#f5f5f5";
  ctx.fillRect(road.left+115,yy,5,48);
  ctx.fillRect(road.left+230,yy,5,48);
 }
 traffic.forEach(c=>drawCar(c.x,c.y,c.w,c.h,c.color));
 drawCar(player.x,player.y,player.w,player.h,
  nitroTime>0?"#00eaff":"#e6e9ef",true);

 if(nitroTime>0){
  ctx.fillStyle="#00d9ff";
  ctx.beginPath();
  ctx.moveTo(player.x+8,player.y+player.h);
  ctx.lineTo(player.x+15,player.y+player.h+30+Math.random()*15);
  ctx.lineTo(player.x+22,player.y+player.h);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(player.x+25,player.y+player.h);
  ctx.lineTo(player.x+33,player.y+player.h+30+Math.random()*15);
  ctx.lineTo(player.x+38,player.y+player.h);
  ctx.fill();
 }
 if(!running){
  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(0,270,480,130);
  ctx.fillStyle="#00d9ff";
  ctx.textAlign="center";
  ctx.font="bold 28px Arial";
  ctx.fillText(finished?"RENNEN BEENDET":"STARK RACING",240,320);
  ctx.font="18px Arial";
  ctx.fillStyle="white";
  ctx.fillText(finished?"Bereit für die nächste Runde?":"Starte dein Rennen!",240,355);
 }
}

function loop(time){
 if(!running)return;
 const dt=Math.min((time-lastTime)/1000,.04);
 lastTime=time;
 update(dt);
 draw();
 if(running)requestAnimationFrame(loop);
}

function bindHold(id,key){
 const el=$(id);
 const down=e=>{e.preventDefault();keys[key]=true;};
 const up=e=>{e.preventDefault();keys[key]=false;};
 el.addEventListener("pointerdown",down);
 el.addEventListener("pointerup",up);
 el.addEventListener("pointerleave",up);
 el.addEventListener("pointercancel",up);
}
bindHold("left","left");
bindHold("right","right");
bindHold("brake","brake");
bindHold("nitro","nitro");

window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=true;
 if(e.key===" "||e.key.toLowerCase()==="shift")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=false;
 if(e.key===" "||e.key.toLowerCase()==="shift")keys.nitro=false;
});

$("start").addEventListener("click",startGame);
$("sound").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 SOUND: AN":"🔇 SOUND: AUS";
 if(soundOn)startSound();
 updateSound();
});

draw();
updateHUD();
</script>
</body>
</html>
